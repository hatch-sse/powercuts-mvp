name: Poll outages

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: powercuts-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Sync branch before generating data
        run: git pull --rebase

      - name: Restore outage database cache
        id: outage_db_cache
        uses: actions/cache@v4
        with:
          path: data/powercuts.db
          key: powercuts-db-${{ github.run_id }}
          restore-keys: |
            powercuts-db-

      - name: Seed outage database when cache is missing
        if: steps.outage_db_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          git show 728ebb3ba50ee7230c686d9663de8b52cfc30e4c:data/powercuts.db > data/powercuts.db
          ls -lh data/powercuts.db

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run fetch script
        run: python scripts/fetch.py

      - name: Run weekly export
        run: python scripts/export_weekly.py

      - name: Run annual and monthly exports
        run: python scripts/export_periodic.py

      - name: Run postcode sector exports
        run: python scripts/export_sectors.py

      - name: Build dashboard data
        run: python scripts/export_dashboard.py

      - name: Decide export commit scope
        id: commit_scope
        run: |
          hour=$(date -u +%H)
          minute=$(date -u +%M)
          echo "commit_exports=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$hour" = "00" ] && [ "$minute" = "03" ]; }; then
            echo "commit_exports=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update outage dashboard"
            for i in 1 2 3; do
              git pull --rebase --autostash
              git push && break
              echo "Push failed, retrying in 10 seconds..."
              sleep 10
            done
          fi

      - name: Commit daily exports
        if: steps.commit_scope.outputs.commit_exports == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exports/
          if ! git diff --cached --quiet; then
            git commit -m "Update outage CSV exports"
            for i in 1 2 3; do
              git pull --rebase --autostash
              git push && break
              echo "Push failed, retrying in 10 seconds..."
              sleep 10
            done
          fi
